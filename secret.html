<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secret Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #090509;
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100svh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #35121f,
                    #0b0508 65%
                );
        }

        .dashboard {
            width: 100%;
            max-width: 380px;

            padding: 35px 25px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 24px;

            background:
                rgba(255,255,255,0.04);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.5);

            text-align: center;
        }

        .heart {
            font-size: 55px;

            color: #efa4bd;

            margin-bottom: 15px;

            transition: 0.5s ease;
        }

        .heart.active {
            transform: scale(1.2);

            text-shadow:
                0 0 35px
                rgba(255,100,160,0.6);
        }

        h1 {
            margin: 0;

            font-family: Georgia, serif;

            font-size: 32px;

            font-weight: 400;
        }

        .label {
            margin-top: 10px;

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #eaa0b8;

            opacity: 0.7;
        }

        .status {
            margin-top: 45px;

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.03);

            border:
                1px solid
                rgba(255,255,255,0.06);

            font-size: 16px;

            color: #777;

            transition: 0.5s ease;
        }

        .status.active {
            color: #ffabc3;

            border-color:
                rgba(255,140,175,0.25);

            background:
                rgba(255,100,150,0.08);

            box-shadow:
                0 0 35px
                rgba(255,100,150,0.1);
        }

        .time {
            margin-top: 15px;

            font-size: 11px;

            color: #777;
        }

    </style>

</head>


<body>

    <div class="dashboard">

        <div
            id="heart"
            class="heart"
        >
            ♡
        </div>


        <h1>
            Our Story
        </h1>


        <div class="label">
            Secret Dashboard
        </div>


        <div
            id="status"
            class="status"
        >
            Waiting for her...
        </div>


        <div
            id="time"
            class="time"
        >
        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyBF9DyTvKfy4dsReRa6ABBPIdXDrV-XkB0",

            authDomain:
                "tokopedia-400gb-1rp.firebaseapp.com",

            projectId:
                "tokopedia-400gb-1rp",

            storageBucket:
                "tokopedia-400gb-1rp.firebasestorage.app",

            messagingSenderId:
                "110459851237",

            appId:
                "1:110459851237:web:7b5b8f98003ac9e8741f0c",

            measurementId:
                "G-22WV3ZTWVP",

            databaseURL:
                "https://tokopedia-400gb-1rp-default-rtdb.asia-southeast1.firebasedatabase.app"
        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const database =
            getDatabase(app);


        const statusRef =
            ref(
                database,
                "loveStory/status"
            );


        const statusElement =
            document.getElementById(
                "status"
            );


        const timeElement =
            document.getElementById(
                "time"
            );


        const heartElement =
            document.getElementById(
                "heart"
            );


        onValue(
            statusRef,
            (snapshot) => {

                const data =
                    snapshot.val();


                if (!data) {

                    statusElement.innerText =
                        "Waiting for her...";

                    return;
                }


                if (
                    data.event ===
                    "open_it"
                ) {

                    statusElement.innerText =
                        "❤️ SHE PRESSED IT";


                    statusElement.classList.add(
                        "active"
                    );


                    heartElement.classList.add(
                        "active"
                    );


                    if (data.openedAt) {

                        const date =
                            new Date(
                                data.openedAt
                            );


                        timeElement.innerText =
                            date.toLocaleString();

                    }

                }

            }
        );

    </script>

</body>

</html>
